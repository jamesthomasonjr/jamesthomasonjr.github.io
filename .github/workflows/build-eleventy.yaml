name: Build Eleventy

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

# Deploys replace the whole gh-pages branch, so never run two at once.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build Eleventy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./_site
          github_token: ${{ secrets.GITHUB_TOKEN }}
